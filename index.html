<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>স্টুডেন্ট টাস্ক ও রুটিন ট্র্যাকার</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- সাইডবার মেনু -->
    <div class="sidebar">
        <h2>Student Tracker</h2>
        <ul>
            <li><a href="#" id="navDashboard" class="active">🏠 ড্যাশবোর্ড</a></li>
            <li><a href="#" id="navRoutine">📅 ক্লাস রুটিন</a></li>
        </ul>
    </div>
    
    <!-- মূল কন্টেন্ট এরিয়া -->
    <div class="main-content">
        
        <!-- ড্যাশবোর্ড সেকশন (আপডেট করা হয়েছে) -->
        <div id="dashboardSection" class="section">
            <h1>আজকের ড্যাশবোর্ড 🎯</h1>
            
            <!-- লাইভ কাউন্টার ও সামারি কার্ডস -->
            <div class="card-container" style="display: flex; gap: 20px; margin-bottom: 30px;">
                <div class="card" style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 250px; border-top: 5px solid #e74c3c;">
                    <h3 style="margin-top:0;">বাকি থাকা টাস্ক ⏳</h3>
                    <p id="totalTasksCount" style="font-size: 24px; font-weight: bold; color: #e74c3c; margin: 10px 0;">০ টি</p>
                </div>
                <div class="card" style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 250px; border-top: 5px solid #2ecc71;">
                    <h3 style="margin-top:0;">আজকের মোট ক্লাস 📚</h3>
                    <p id="todayClassesCount" style="font-size: 24px; font-weight: bold; color: #2ecc71; margin: 10px 0;">০ টি</p>
                </div>
            </div>

            <!-- টাস্ক ইনপুট ফর্ম -->
            <div class="task-form-container">
                <h3>নতুন অ্যাসাইনমেন্ট / টাস্ক যুক্ত করুন ➕</h3>
                <div class="form-group">
                    <input type="text" id="taskTitle" placeholder="অ্যাসাইনমেন্ট বা টাস্কের নাম লিখুন...">
                    <input type="date" id="taskDate">
                    <button id="addTaskBtn">Add Task</button>
                </div>
            </div>

            <!-- টাস্ক দেখানোর লিস্ট এরিয়া -->
            <div class="task-list-container">
                <h3>আপনার বাকি থাকা টাস্কসমূহ ⏳</h3>
                <ul id="taskList"></ul>
            </div>
        </div>

        <!-- ক্লাস রুটিন সেকশন -->
        <div id="routineSection" class="section hidden">
            <h1>ক্লাস রুটিন ম্যানেজার 📅</h1>
            
            <!-- রুটিন ইনপুট ফর্ম -->
            <div class="task-form-container">
                <h3>নতুন ক্লাস রুটিন যুক্ত করুন ⏱️</h3>
                <div class="form-group">
                    <select id="classDay">
                        <option value="রবিবার">রবিবার</option>
                        <option value="সোমবার">সোমবার</option>
                        <option value="মঙ্গলবার">মঙ্গলবার</option>
                        <option value="বুধবার">বুধবার</option>
                        <option value="বৃহস্পতিবার">বৃহস্পতিবার</option>
                    </select>
                    <input type="text" id="classSubject" placeholder="বিষয়ের নাম (যেমন: CSE 2100)...">
                    <input type="time" id="classTime">
                    <input type="text" id="classRoom" placeholder="রুম নম্বর (যেমন: Lab 3)...">
                    <button id="addClassBtn">Add Class</button>
                </div>
            </div>

            <!-- রুটিন তালিকা -->
            <div class="task-list-container">
                <h3>আপনার সাপ্তাহিক রুটিন 📋</h3>
                <div id="routineDisplayArea"></div>
            </div>
        </div>

    </div>

    <!-- লজিক ফাইলটি কানেক্ট করা -->
    <script src="renderer.js"></script>
</body>
</html>
