<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>স্টুডেন্ট টাস্ক ও রুটিন ট্র্যাকার</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- সাইডবার মেনু -->
    <div class="sidebar">
        <h2>Student Tracker</h2>
        <ul>
            <li><a href="#" class="active">🏠 ড্যাশবোর্ড</a></li>
            <li><a href="#">📅 ক্লাস রুটিন</a></li>
            <li><a href="#">📝 অ্যাসাইনমেন্ট ও টাস্ক</a></li>
        </ul>
    </div>
    
    <!-- মূল কন্টেন্ট এরিয়া -->
    <div class="main-content">
        <h1>আজকের ড্যাশবোর্ড 🎯</h1>
        
        <!-- টাস্ক ইনপুট ফর্ম -->
        <div class="task-form-container">
            <h3>নতুন অ্যাসাইনমেন্ট / টাস্ক যুক্ত করুন ➕</h3>
            <div class="form-group">
                <input type="text" id="taskTitle" placeholder="অ্যাসাইনমেন্ট বা টাস্কের নাম লিখুন...">
                <input type="date" id="taskDate">
                <button id="addTaskBtn">Add Task</button>
            </div>
        </div>

        <!-- টাস্ক দেখানোর লিস্ট এরিয়া -->
        <div class="task-list-container">
            <h3>আপনার বাকি থাকা টাস্কসমূহ ⏳</h3>
            <ul id="taskList">
                <!-- এখানে জাভাস্ক্রিপ্ট দিয়ে নতুন টাস্কগুলো অটো যুক্ত হবে -->
            </ul>
        </div>
    </div>

    <!-- লজিক ফাইলটি কানেক্ট করা -->
    <script src="renderer.js"></script>
</body>
</html>
